<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Lab: The Robot Repair Garage</title><style>
:root{font-family:system-ui,sans-serif;color:#172341;background:#e9f3f6}*{box-sizing:border-box}body{margin:0}header{background:#112b4f;color:white;padding:14px 20px}header strong{font-size:1.25rem}header span{display:block;color:#a8e7f2;font-size:.86rem}.wrap{max-width:980px;margin:auto;padding:16px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:white;border-radius:14px;padding:12px;margin-bottom:14px;box-shadow:0 3px 12px #16334a1a}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#14647a;color:white;padding:11px 16px;font-weight:700}button:hover{filter:brightness(1.12)}button:focus-visible,select:focus-visible{outline:3px solid #ef9f16;outline-offset:3px}.secondary{background:#e8f1f4;color:#18374f}.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 24px #16334a25}.card h1{font-size:clamp(1.35rem,4vw,2rem);margin:0;padding:16px 20px;background:#ffdc75}.scene{display:block;width:100%;max-height:430px;object-fit:contain;background:#edf2f3}.content{padding:20px}.line{font-size:1.08rem;line-height:1.55;margin:8px 0}.speaker{font-weight:800;color:#15556f;margin-top:15px}.clue{background:#edf6f7;border-left:4px solid #4a9dad;padding:12px 16px;border-radius:5px;margin:12px 0;white-space:pre-line}.decision{background:#fff0bb;padding:12px;border-radius:9px;font-weight:800;margin-top:18px}.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.choices button{flex:1 1 210px;background:#17657e;min-height:52px}.progress{font-size:.9rem;color:#465b6b}footer{font-size:.9rem;color:#526b77;padding:18px 0}#notice{color:#834200;font-size:.9rem}label{font-size:.9rem}select{padding:7px;border:1px solid #789;border-radius:6px;max-width:220px}</style></head><body><header><strong>MYSTERY LAB</strong><span>ISSUE 8: THE ROBOT REPAIR GARAGE</span></header><main class="wrap"><div class="controls"><button id="read">🔊 Read this page</button><button id="stop" class="secondary">■ Stop reading</button><label for="voice">Voice</label><select id="voice"><option value="">Device default</option></select><label for="speed">Speed</label><select id="speed"><option value="0.8">Slow</option><option value="0.95" selected>Normal</option><option value="1.1">Faster</option></select><span id="notice" role="status"></span></div><article class="card" id="card"></article><footer>Choose a button to continue. Your repair progress is saved on this device until you restart the mission.</footer></main><script src="data.js"></script><script>
let current=1; let completed=new Set(); try{completed=new Set(JSON.parse(localStorage.getItem('mystery8-repairs')||'[]'))}catch(e){} const names={7:'Eyes',10:'Voice',13:'Arms',16:'Chest warmer'}; const card=document.getElementById('card'),notice=document.getElementById('notice'); const voice=document.getElementById('voice'); let voices=[];
function setVoices(){if(!('speechSynthesis'in window))return;let old=voice.value;voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));voice.replaceChildren(new Option('Device default',''));voices.forEach((v,i)=>voice.add(new Option(v.name+' ('+v.lang+')',String(i))));voice.value=old}
if('speechSynthesis'in window){setVoices();speechSynthesis.onvoiceschanged=setVoices}else notice.textContent='Read aloud is not supported in this browser.';
function say(){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let s=slides[current-1];let all=[s.text.join('. '),'Choose: '+s.choices.map(c=>c.label).join('. ')].join('. ');let u=new SpeechSynthesisUtterance(all);u.rate=+document.getElementById('speed').value;u.lang='en-US';if(voice.value!==''&&voices[+voice.value])u.voice=voices[+voice.value];u.onerror=()=>notice.textContent='Audio could not play. Check the device volume and browser voice settings.';notice.textContent='';speechSynthesis.speak(u)}
function show(n,read=false){if('speechSynthesis'in window)speechSynthesis.cancel();current=n;let s=slides[n-1]; if(names[n]){completed.add(names[n]);try{localStorage.setItem('mystery8-repairs',JSON.stringify([...completed]))}catch(e){}} card.replaceChildren();let h=document.createElement('h1');h.textContent=s.text[0]||'Mystery Lab';card.append(h);let img=document.createElement('img');img.className='scene';img.src=s.image;img.alt='Mystery Lab illustration for '+h.textContent;card.append(img);let c=document.createElement('div');c.className='content';let progress=document.createElement('p');progress.className='progress';progress.textContent='Repairs completed: '+completed.size+' of 4'+(completed.size?' · '+[...completed].join(', '):'');c.append(progress);let speakers=['Maya','Diego','Priya','Dr. Park','Sparky','Principal','Mr. Reyes'];s.text.slice(1).forEach(t=>{let el=document.createElement('p');el.className=speakers.includes(t)?'speaker':t.startsWith('THE CLASS DECIDES')?'decision':'line';el.textContent=t;c.append(el)});let b=document.createElement('div');b.className='choices';s.choices.forEach(choice=>{let btn=document.createElement('button');btn.textContent=choice.label;btn.onclick=()=>{if(n===19&&choice.to===1){completed.clear();try{localStorage.removeItem('mystery8-repairs')}catch(e){}}show(choice.to,true)};b.append(btn)});c.append(b);card.append(c);window.scrollTo({top:0,behavior:'smooth'});if(read)say()}
document.getElementById('read').onclick=say;document.getElementById('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};show(1);
</script></body></html>
